services:
  - type: web
    name: nim-academy-backend-oct26
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn student_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
